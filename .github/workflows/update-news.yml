name: Update news and releases

# Частое лёгкое обновление: новости (RSS) и новые релизы (MusicBrainz). Тренды не затрагивает.
on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Collect news and releases
        working-directory: backend
        env:
          DJPULSE_REPO: https://github.com/${{ github.repository }}
        run: python run_update.py --only news
      - name: Commit data
        run: |
          git config user.name "dj-pulse-bot"
          git config user.email "dj-pulse-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Изменений нет"; exit 0; fi
          git commit -m "data: news $(date -u +'%F %H:%M')"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break || sleep 5; done

  deploy:
    needs: collect
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
