name: Update data

# Ежедневный сбор данных. Можно запустить вручную: Actions → Update data → Run workflow.
on:
  schedule:
    - cron: "30 4 * * *"   # 04:30 UTC = 07:30 по Москве
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Self-check (tests)
        working-directory: backend
        run: python -m pytest -q

      - name: Collect data
        working-directory: backend
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          DJPULSE_REPO: https://github.com/${{ github.repository }}
        run: python run_update.py

      - name: Commit data
        run: |
          git config user.name "dj-pulse-bot"
          git config user.email "dj-pulse-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Изменений нет"; exit 0; fi
          git commit -m "data: update $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break || sleep 5; done

      # Необязательно: если заданы секреты BOT_TOKEN и OWNER_CHAT_ID, при сбое придёт сообщение в Telegram.
      - name: Notify owner on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_CHAT_ID" ]; then echo "Уведомления не настроены"; exit 0; fi
          curl -s -o /dev/null "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_CHAT_ID}" \
            --data-urlencode "text=⚠️ DJ PULSE: ежедневный сбор данных завершился с ошибкой. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true

  deploy:
    needs: collect
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
