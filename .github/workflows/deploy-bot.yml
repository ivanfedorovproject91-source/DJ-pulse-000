name: Deploy bot

# Публикует Telegram-бота (Cloudflare Worker) прямо из GitHub — ничего не нужно ставить на компьютер.
# Требуются секреты репозитория: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BOT_TOKEN, WEBHOOK_SECRET (см. README).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bot/worker/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests
        working-directory: bot/worker
        run: node --test test/*.test.js
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot/worker
          command: deploy --var APP_URL:https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          secrets: |
            BOT_TOKEN
            WEBHOOK_SECRET
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
