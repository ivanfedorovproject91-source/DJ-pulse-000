name: Deploy bot

# Публикует Telegram-бота (Cloudflare Worker) прямо из GitHub — ничего не нужно ставить на компьютер.
# Всё делается за один запуск: создаёт хранилище подписчиков, публикует Worker, задаёт секреты,
# подключает вебхук/меню/команды в Telegram и сообщает приложению адрес бота.
# Нужны 4 секрета репозитория: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BOT_TOKEN, WEBHOOK_SECRET.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bot/worker/**"]

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check secrets
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOT_TOKEN WEBHOOK_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::Не задан секрет $v (Settings → Secrets and variables → Actions)"; fail=1; fi
          done
          [ -z "$fail" ]

      - name: Tests
        working-directory: bot/worker
        run: node --test test/*.test.js

      - name: Prepare storage (KV)
        working-directory: bot/worker
        run: |
          find_id() { npx --yes wrangler@3 kv namespace list 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((x['id'] for x in d if x['title'].endswith('SUBS')), ''))"; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx --yes wrangler@3 kv namespace create SUBS; ID=$(find_id); fi
          [ -n "$ID" ] || { echo "::error::Не удалось создать хранилище KV (проверьте права токена Cloudflare)"; exit 1; }
          sed -i "s/PASTE_KV_NAMESPACE_ID_HERE/$ID/" wrangler.toml
          echo "KV ok"

      - name: Deploy Worker
        working-directory: bot/worker
        run: |
          npx --yes wrangler@3 deploy --var APP_URL:https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }} 2>&1 | tee deploy.log
          URL=$(grep -o 'https://[A-Za-z0-9.-]*workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::Не нашёл адрес Worker в ответе. Если Cloudflare просит workers.dev-поддомен: Workers & Pages → Account details → Change (задайте любое имя) и запустите снова"; exit 1; }
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"

      - name: Set secrets
        working-directory: bot/worker
        run: |
          printf '%s' "$BOT_TOKEN" | npx --yes wrangler@3 secret put BOT_TOKEN
          printf '%s' "$WEBHOOK_SECRET" | npx --yes wrangler@3 secret put WEBHOOK_SECRET

      - name: Connect Telegram (webhook, menu, commands)
        run: |
          sleep 5
          RES=$(curl -s --retry 5 --retry-delay 5 --retry-all-errors "$WORKER_URL/setup/$WEBHOOK_SECRET")
          echo "$RES"
          echo "$RES" | grep -q '"webhook":true' || { echo "::error::Telegram не принял настройку: $RES"; exit 1; }

      - name: Tell the app where the bot lives
        run: |
          mkdir -p data/public
          printf '{"api":"%s"}\n' "$WORKER_URL" > data/public/bot.json
          git config user.name "dj-pulse-bot"
          git config user.email "dj-pulse-bot@users.noreply.github.com"
          git add data/public/bot.json
          git diff --cached --quiet || { git commit -m "bot: worker url"; git pull --rebase -q origin main; git push origin HEAD:main; }

  app:
    needs: bot
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
